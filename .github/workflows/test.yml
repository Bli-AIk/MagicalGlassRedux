name: Test Library

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check Lua syntax
        run: find . -path ./.git -prune -o -type f -name '*.lua' -exec luajit -b {} /dev/null \;
      - name: Test save menu playtime
        run: luajit tests/save_menu_playtime.lua
